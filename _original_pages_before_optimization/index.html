<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI网课学院</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

      font-family: "Helvetica Neue", Helvetica, Arial, "微软雅黑", sans-serif;
    }
    :root {
      --primary-purple: #6338f5;
      --text-dark: #111827;
      --text-gray: #6b7280;
      --bg-light: #f8fafc;
      --white: #ffffff;
      --border-radius: 999px;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    html, body {
      overflow: visible !important;
      overflow-y: auto !important;
      height: auto !important;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-dark);
    }

    /* 可关闭滚动横幅 */
    .top-banner {
      position: relative;
      background-color: var(--primary-purple);
      color: white;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      overflow: hidden;
      white-space: nowrap;
    }
    .banner-close {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      z-index: 10;
    }
    .banner-text {
      display: inline-block;
      animation: scroll 15s linear infinite;
      padding-left: 100%;
    }
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    /* 导航 */
    header {
      padding: 16px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 999;
      background: white;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      background-color: var(--primary-purple);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    /* 右上角头像 */
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid #eee;
    }

    /* 大封面 */
    .hero {
      position: relative;
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      overflow: visible;
    }
    .hero-bg-shape {
      position: absolute;
      z-index: -1;
    }
    .shape-pink {
      width: 420px;
      height: 420px;
      background: #ffc2d1;
      border-radius: 50%;
      top: -80px;
      left: -120px;
    }
    .shape-green {
      width: 260px;
      height: 260px;
      background: #86efac;
      top: 60px;
      right: 30%;
    }
    .shape-blue {
      width: 380px;
      height: 380px;
      background: #3b82f6;
      bottom: -120px;
      left: -80px;
      clip-path: polygon(0 0, 100% 0, 100% 100%);
    }
    .shape-yellow {
      width: 460px;
      height: 460px;
      background: #facc15;
      bottom: -180px;
      right: -100px;
      clip-path: polygon(0 0, 100% 100%, 0 100%);
    }
    .hero-title {
      font-size: 72px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 24px;
      color: var(--text-dark);
    }
    .hero-desc {
      font-size: 18px;
      color: var(--text-gray);
      max-width: 700px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .hero-tags {
      display: flex;
      gap: 24px;
    }
    .hero-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
    }
    .hero-tag-dot {
      width: 12px;
      height: 12px;
      background-color: var(--primary-purple);
      border-radius: 50%;
    }

    /* ========== 你要的：手动点击箭头 + 卡片底部绿色方块按钮 ========== */
    .manual-slide-box {
      max-width: 1200px;
      margin: 0 auto 40px;
      padding: 0 20px;
    }
    .slide-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .slide-wrap {
      position: relative;
      overflow: hidden;
    }
    .slide-track {
      display: flex;
      gap: 20px;
      transition: transform 0.3s ease;
    }
    /* 单个卡片 */
    .slide-card {
      min-width: 260px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .slide-card-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }
    .slide-card-info {
      padding: 12px;
    }
    .slide-card-title {
      font-weight: bold;
      margin-bottom: 10px;
    }
    .slide-card-tag {
      font-size: 10px;
      padding: 2px 6px;
      background: #eee;
      border-radius: 4px;
      margin-right: 4px;
    }
    .slide-card-discount {
      color: red;
      font-size: 10px;
    }
    /* 重点：卡片底部绿色方块按钮！不是外框！ */
    .card-green-btn {
      width: 100%;
      height: 44px;
      background: #22c55e; /*纯绿色方块*/
      border: none;
      color: white;
      margin-top: 10px;
      cursor: pointer;
    }
    /* 左右箭头按钮 手动点击切换 */
    .arrow-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      background: white;
      border: none;
      border-radius: 50%;
      font-size: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      cursor: pointer;
      z-index: 10;
    }
    .arrow-left { left: 10px; }
    .arrow-right{ right:10px; }

    /* 原有网课区域完全不动 */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 60px;
      display: flex;
      gap: 32px;
    }
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      position: sticky;
      top: 120px;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    .sidebar-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--border-radius);
      border: 1px solid #e5e7eb;
      font-size: 14px;
      margin-bottom: 24px;
      outline: none;
    }
    .filter-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .filter-item {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 50;
      cursor: pointer;
    }
    .filter-item.active {
      background-color: var(--primary-purple);
      color: white;
    }
    .course-content {
      flex: 1;
    }
    .course-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .course-card {
      background-color: var(--white);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .course-cover {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .course-info {
      padding: 20px;
    }
    .course-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .course-tag {
      font-size: 12px;
      color: var(--primary-purple);
      background-color: #ede9fe;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .modal-mask {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .modal-box {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      padding: 32px;
    }
    .modal-title {
      font-size: 22px;
      text-align: center;
      margin-bottom: 24px;
    }
    .modal-input {
      width: 100%;
      padding: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .modal-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary-purple);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .modal-btn-outline {
      background: transparent;
      color: #222;
      border: 1px solid #ddd;
      margin-top: 8px;
    }

    .chat-float-btn {
      position: fixed;
      bottom: 32px;
      right: 32px;
      width: 64px;
      height: 64px;
      background: var(--primary-purple);
      border-radius: 50%;
      color: white;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 998;
    }
    .chat-panel {
      position: fixed;
      bottom: 110px;
      right: 32px;
      width: 360px;
      background: white;
      border-radius: 20px;
      box-shadow: var(--shadow);
      display: none;
      flex-direction: column;
      z-index: 998;
    }
    .chat-body {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }
    .chat-msg {
      max-width: 75%;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .msg-user {
      background: var(--primary-purple);
      color: white;
      align-self: flex-end;
    }
    .msg-bot {
      background: #f3f4f6;
      align-self: flex-start;
    }

    .ball {
      position: absolute;
      width: 26px;
      height: 26px;
      background: #facc15;
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
    }

    @media (max-width:768px) {
      .container {flex-direction: column;}
      .sidebar {width: 100%; position: static;}
      .course-grid {grid-template-columns: repeat(2,1fr);}
    }

    /* ===== 修复补充样式 ===== */
    /* 搜索无结果时的空状态提示 */
    .course-empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-gray);
      padding: 60px 20px;
      font-size: 15px;
    }
    /* 装饰小球不应挡住点击 */
    .ball { pointer-events: none; }
    /* 窄屏下客服面板不溢出屏幕 */
    @media (max-width: 480px) {
      .chat-panel { width: calc(100vw - 32px); right: 16px; }
    }
  </style>
</head>

<script>
function closeBanner(){document.getElementById('banner').style.display='none'}

// ========== 手动点击箭头切换逻辑（已加边界限制：修"右箭头可无限移出屏幕"） ==========
let slideIndex = 0;
const track = document.getElementById('slideTrack');
const CARD_W = 280; // 卡片宽 260 + 间距 20

function maxSlideIndex(){
  const wrap = track.parentElement;
  const totalW = track.children.length * CARD_W - 20; // 减去最后一个间距
  const maxOffset = Math.max(0, totalW - wrap.clientWidth);
  return Math.max(0, Math.ceil(maxOffset / CARD_W));
}
function updateSlide(){
  slideIndex = Math.min(Math.max(slideIndex, 0), maxSlideIndex());
  track.style.transform = `translateX(-${slideIndex * CARD_W}px)`;
}
function nextSlide(){ slideIndex++; updateSlide(); }
function prevSlide(){ slideIndex--; updateSlide(); }
window.addEventListener('resize', updateSlide);

// 课程数据已抽到 assets/courses.js（由 index.html 与 course.html 共享），此处不再重复定义。

// 修：assets/course/ 目前只有 6 张真实封面，另外 14 门课原来统一回落到同一张
//     placeholder.svg，看起来像 14 个重复的灰块。改为按课程即时生成一张带标题的
//     封面（data URI，不依赖任何外部文件）。日后把 4.jpg 等真实封面放进
//     assets/course/ 即可自动生效，无需再改代码。
const COVER_COLOR = {
  data:  ['#6366f1', '#8b5cf6'],
  inter: ['#00E08E', '#22c55e'],
  ethic: ['#FF62CB', '#e11d48'],
  cross: ['#38bdf8', '#6366f1']
};
function coverFallback(id){
  const c = COURSES.find(x => x.id === id) || {title:'课程', tag:'', type:'data'};
  const col = COVER_COLOR[c.type] || COVER_COLOR.data;
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const t = c.title;
  const isAscii = ch => /[A-Za-z0-9]/.test(ch);
  let lines;
  if (t.length <= 8) {
    lines = [t];
  } else {
    let br = Math.ceil(t.length / 2);
    // 不要把 "AI" 这类连续英文/数字从中间劈开（否则会出现 "...趣味A" / "I数据..."）
    while (br > 1 && isAscii(t[br - 1])) br--;
    lines = [t.slice(0, br), t.slice(br)];
  }
  // 估算行宽（中文按 1 个字号宽，英文数字按 0.55），过宽就缩一号字
  const units = s => Array.from(s).reduce((n, ch) => n + (isAscii(ch) ? 0.55 : 1), 0);
  const fz = lines.some(l => units(l) > 8.2) ? 34 : 42;
  const y0 = lines.length === 1 ? 215 : 185;
  const titleSvg = lines.map((ln, i) =>
    '<text x="320" y="' + (y0 + i * 56) + '" text-anchor="middle" ' +
    'font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="' + fz + '" font-weight="700" ' +
    'fill="#ffffff">' + esc(ln) + '</text>'
  ).join('');
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="' + col[0] + '"/>' +
        '<stop offset="1" stop-color="' + col[1] + '"/>' +
      '</linearGradient></defs>' +
      '<rect width="640" height="400" fill="url(#g)"/>' +
      '<circle cx="560" cy="70" r="110" fill="#ffffff" opacity="0.10"/>' +
      '<circle cx="70" cy="350" r="80" fill="#ffffff" opacity="0.08"/>' +
      '<text x="40" y="70" font-family="PingFang SC,Microsoft YaHei,sans-serif" ' +
        'font-size="22" fill="#ffffff" opacity="0.85">' + esc(c.tag) + '</text>' +
      titleSvg +
    '</svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

let currentFilter="all";let keyword="";
function renderCourse(){
  const grid=document.getElementById('courseGrid');
  const list=COURSES.filter(item=>{
    const tagOk=currentFilter==='all'||item.type===currentFilter;
    const keyOk=item.title.includes(keyword);
    return tagOk&&keyOk;
  });
  // 修：搜索/筛选无结果时给出提示，而不是留一片空白
  if(!list.length){
    grid.innerHTML='<div class="course-empty">没有找到匹配的课程，换个关键词试试～</div>';
    return;
  }
  // 修：此前只有第 0 张卡片可点击，且筛选后"第一张"会变，导致点击的卡片与跳转内容不符。
  //     现在每张卡片都可点击，并把课程 id 传给详情页。
  grid.innerHTML=list.map(item=>`
  <div class="course-card" onclick="openCourse(${item.id})" style="cursor:pointer;">
    <img class="course-cover" src="${item.img}" alt="${item.title}" onerror="this.onerror=null;this.src=coverFallback(${item.id})">
    <div class="course-info">
      <div class="course-title">${item.title}</div>
      <span class="course-tag">${item.tag}</span>
    </div>
  </div>
`).join('');
}
function openCourse(id){ location.href='course.html?id='+id; }

  document.querySelectorAll('.filter-item').forEach(e=>e.classList.remove('active'));

// 修：openLogin() 此前无任何按钮调用，登录弹窗永远打不开。现由头像点击触发：
//     未登录 -> 打开登录框；已登录 -> 打开个人中心
function onAvatarClick(){ localStorage.getItem('login') ? openProfile() : openLogin(); }
function openLogin(){document.getElementById('loginModal').style.display='flex'}
function closeLogin(){document.getElementById('loginModal').style.display='none'}
function login(){

function openProfile(){document.getElementById('profileModal').style.display='flex'}
function closeProfile(){document.getElementById('profileModal').style.display='none'}

// 修：原代码依赖 window.event（Firefox 报错）、无文件类型/大小校验、写 localStorage 无 try/catch（大图会静默失败）
function changeAvatar(ev){
  const file=(ev && ev.target && ev.target.files) ? ev.target.files[0] : null;
  if(!file) return;
  if(!file.type || file.type.indexOf('image/')!==0){ alert('请选择图片文件'); return; }
  if(file.size > 2*1024*1024){ alert('图片过大，请选择 2MB 以内的图片'); return; }
  const reader=new FileReader();
  reader.onload=e=>{
    document.querySelector('.avatar').src=e.target.result;
    document.getElementById('profileAvatar').src=e.target.result;
    try{ localStorage.setItem('avatar',e.target.result); }
    catch(err){ alert('该图片过大，无法保存到本地（不影响本次预览）'); }
  };
  reader.readAsDataURL(file);
}

function toggleChat(){const p=document.getElementById('chatPanel');p.style.display=p.style.display==='flex'?'none':'flex'}
function sendMsg(){
  const input=document.getElementById('chatInput');
  const msg=input.value.trim();
  if(!msg)return;
  // 修：原来用 innerHTML 拼接用户输入，输入 <img onerror=...> 会执行脚本（XSS）。
  //     改用 textContent，从根上杜绝。
  const div=document.createElement('div');
  div.className='chat-msg msg-user';
  div.textContent=msg;
  document.getElementById('chatBody').appendChild(div);
  input.value='';
  div.scrollIntoView({block:'nearest'});
}

// 修：原来把 Matter 的解构写在顶层，一旦 matter-js 加载失败就会抛错，
//     导致后面的 window.onload 永远不被赋值 -> 课程网格整个不渲染（页面空白）。
//     现改为：延迟到 initBall 内部解构，并做存在性判断；同时防止重复初始化。
let ballInited=false;
function initBall(){
  if(ballInited) return;
  if(typeof Matter==='undefined'){ console.warn('matter-js 未加载，跳过弹球动画（其余功能不受影响）'); return; }
  ballInited=true;
  const {Engine,Bodies,Composite,Events}=Matter;
  const engine=Engine.create();const world=engine.world;
  const edges=[Bodies.rectangle(innerWidth/2,-10,innerWidth,20,{isStatic:true}),Bodies.rectangle(innerWidth/2,innerHeight+10,innerWidth,20,{isStatic:true})];
  Composite.add(world,edges);
  for(let i=0;i<12;i++){
    const div=document.createElement('div');div.className='ball';div.innerText='😊';document.body.appendChild(div);
    const body=Bodies.circle(Math.random()*innerWidth,50,13,{restitution:0.8});
    Composite.add(world,body);
    Events.on(engine,'afterUpdate',()=>{div.style.left=body.position.x-13+'px';div.style.top=body.position.y-13+'px';});
  }
  Engine.run(engine);
}

window.onload=()=>{
  renderCourse();
  const av=localStorage.getItem('avatar');
  if(av)document.querySelector('.avatar').src=av;
  const nk=localStorage.getItem('nick');
  if(nk)document.getElementById('nick').value=nk;
  if(localStorage.getItem('login')) initBall();
}
</script>
