  <header class="site-header">
   <nav aria-label="主导航" class="site-nav">

   </nav>
  </header>
  <main class="game-box" id="main">
   <h1>
    🤖 AI猜数字
   </h1>
   <p class="desc">
    AI已经想好一个 1~100 的数字
    <br/>
    快来猜猜看！
   </p>
   <div class="input-box">
    <label for="guessInput">
     猜一个1到100之间的整数
    </label>
    <input id="guessInput" max="100" min="1" placeholder="输入你的答案" step="1" type="number"/>
   </div>
   <button onclick="guess()">
    开始猜！
   </button>
   <button class="btn-reset" onclick="resetGame()">
    🔄 再来一局
   </button>
   <div aria-live="polite" class="tip" id="tip" role="status">
   </div>
   <div class="ai-info">
    <h2>
     🧠 程序小知识
    </h2>
    <p>
     这个游戏使用随机数与条件判断：程序比较你的输入，并提示偏大、偏小或猜中。它可以帮助你练习逻辑推理，但不会从猜测中学习，也不等同于机器学习模型。
    </p>
   </div>
   <a class="back" href="index.html">
    ← 返回课程列表
   </a>
